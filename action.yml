name: 'Terraform Version Checker'
description: 'Checks Terraform versions in .terraform-version files and required_version constraints, suggests upgrades to latest stable version'
author: 'navjotdevops'

inputs:
  directory:
    description: >
      Where to look for terraform files to check for version updates.
      The directory is relative to the repository's root.
      Multiple paths can be provided by splitting them with a new line.
      Example:
        directory: |
          /path/to/first/module
          /path/to/second/module
    default: "."
    required: false
  
  token:
    description: >
      Auth token used to read the repository being processed.
      Learn more about creating and using encrypted secrets:
      https://help.github.com/en/actions/automating-your-workflow-with-github-actions/creating-and-using-encrypted-secrets
    default: ${{ github.token }}
    required: false
  
  fail-on-updates:
    description: >
      Whether to fail the action if outdated versions are found.
      Set to 'true' to fail the workflow when updates are available.
    default: 'false'
    required: false
  
  patches-behind:
    description: >
      Number of patch versions behind the latest to target.
      For example, if latest is 1.14.4 and patches-behind is 2, 
      the action will suggest 1.14.2 instead.
    default: '2'
    required: false
  
  apply-updates:
    description: >
      Whether to apply the suggested updates to the files.
      Set to 'true' to modify the files in-place.
    default: 'false'
    required: false

  create-pr:
    description: >
      Whether to create a Pull Request with the version updates.
      Requires 'apply-updates' to be 'true'.
    default: 'false'
    required: false

  pr-title:
    description: 'Title for the generated Pull Request'
    default: 'chore: Update Terraform to v${{ steps.version-check.outputs.latest_version }}'
    required: false

  pr-body:
    description: 'Body/Description for the generated Pull Request'
    required: false

  github-token:
    description: 'GitHub token for creating PRs and API access'
    default: '${{ github.token }}'
    required: false

outputs:
  updates_found:
    description: 'Whether any outdated versions were found (true/false)'
    value: ${{ steps.version-check.outputs.updates_found }}
  
  update_count:
    description: 'Number of version updates recommended'
    value: ${{ steps.version-check.outputs.update_count }}
  
  current_version:
    description: 'Current Terraform version(s) found in the repository'
    value: ${{ steps.version-check.outputs.current_version }}
  
  latest_version:
    description: 'Target Terraform version (patches-behind from latest stable)'
    value: ${{ steps.version-check.outputs.latest_version }}
  
  findings:
    description: 'JSON array of all findings with details'
    value: ${{ steps.version-check.outputs.findings }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run Terraform version checker
      id: version-check
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_TOKEN: ${{ inputs.github-token }}
        INPUT_FAIL_ON_UPDATES: ${{ inputs.fail-on-updates }}
        INPUT_PATCHES_BEHIND: ${{ inputs.patches-behind }}
        INPUT_APPLY_UPDATES: ${{ inputs.apply-updates }}
        GITHUB_ACTIONS: "true"
      run: |
        python ${{ github.action_path }}/terraform_version_checker.py

    - name: PR Debug Info
      shell: bash
      run: |
        echo "🔍 Create PR requested: ${{ inputs.create-pr }}"
        echo "📊 Updates found: ${{ steps.version-check.outputs.updates_found }}"
        echo "📦 Target Version: ${{ steps.version-check.outputs.latest_version }}"

    - name: Create Pull Request
      if: |
        inputs.create-pr == 'true' && 
        steps.version-check.outputs.updates_found == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ inputs.github-token }}
        commit-message: 'chore: update terraform to v${{ steps.version-check.outputs.latest_version }}'
        title: '${{ inputs.pr-title || format(''chore: Update Terraform to v{0}'', steps.version-check.outputs.latest_version) }}'
        body: |
          ${{ inputs.pr-body || format('This PR updates Terraform version to latest (**{0}**).
          
          Current version found: **{1}**
          Files needing update: **{2}**
          
          *This PR was automatically generated by the Terraform Version Checker.*', steps.version-check.outputs.latest_version, steps.version-check.outputs.current_version, steps.version-check.outputs.update_count) }}
        branch: 'terraform-update-${{ steps.version-check.outputs.latest_version }}'
        delete-branch: true

branding:
  icon: 'package'
  color: 'purple'
