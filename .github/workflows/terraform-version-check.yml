name: Terraform Version Check

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/.terraform-version'
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/.terraform-version'
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-terraform-versions:
    name: Check Terraform Versions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run Terraform version checker
        id: version-check
        uses: your-org/terraform-version-checker-action@v1
        with:
          directory: |
            ./infrastructure
            ./modules
          fail-on-updates: 'false'
      
      - name: Display results
        run: |
          echo "Updates found: ${{ steps.version-check.outputs.updates_found }}"
          echo "Update count: ${{ steps.version-check.outputs.update_count }}"
          echo "Latest version: ${{ steps.version-check.outputs.latest_version }}"
      
      - name: Create issue if updates available
        if: steps.version-check.outputs.updates_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const findings = JSON.parse(`${{ steps.version-check.outputs.findings }}`);
            const latestVersion = '${{ steps.version-check.outputs.latest_version }}';
            const currentVersion = '${{ steps.version-check.outputs.current_version }}';
            const updateCount = '${{ steps.version-check.outputs.update_count }}';
            
            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'terraform-version-update'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes(`Terraform to v${latestVersion}`)
            );
            
            if (existingIssue) {
              console.log('Issue already exists:', existingIssue.html_url);
              return;
            }
            
            // Create issue body
            let body = `## 🔄 Terraform Version Update Available\n\n`;
            body += `A new stable version of Terraform is available for upgrade.\n\n`;
            body += `### Summary\n\n`;
            body += `- Current version: **${currentVersion}**\n`;
            body += `- Target version: **${latestVersion}**\n`;
            body += `- Files to update: **${updateCount}**\n\n`;
            body += `### Details\n\n`;
            
            // Group findings by type
            const versionFiles = findings.filter(f => f.type === 'terraform-version-file');
            const requiredVersions = findings.filter(f => f.type === 'required-version');
            
            if (versionFiles.length > 0) {
              body += `#### .terraform-version Files\n\n`;
              versionFiles.forEach(finding => {
                body += `- **${finding.file}**\n`;
                body += `  - Current: \`${finding.current_version}\`\n`;
                body += `  - Update to: \`${finding.latest_version}\`\n\n`;
              });
            }
            
            if (requiredVersions.length > 0) {
              body += `#### required_version Constraints\n\n`;
              requiredVersions.forEach(finding => {
                body += `- **${finding.file}**\n`;
                body += `  - Current: \`${finding.current_constraint}\`\n`;
                body += `  - Suggested: \`${finding.suggested_constraint}\`\n\n`;
              });
            }
            
            body += `### Next Steps\n\n`;
            body += `1. Review the [Terraform ${latestVersion} release notes](https://github.com/hashicorp/terraform/releases)\n`;
            body += `2. Update the version specifications in the files listed above\n`;
            body += `3. Test your infrastructure code with the new version\n`;
            body += `4. Deploy the changes\n\n`;
            body += `---\n`;
            body += `*This issue was automatically created by the Terraform Version Checker action.*`;
            
            // Create the issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `feat: Update Terraform to v${latestVersion}`,
              body: body,
              labels: ['terraform-version-update', 'dependencies']
            });
            
            console.log('Created issue:', issue.data.html_url);
      
      - name: Comment on PR (if this is a PR)
        if: |
          steps.version-check.outputs.updates_found == 'true' && 
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const updateCount = '${{ steps.version-check.outputs.update_count }}';
            const latestVersion = '${{ steps.version-check.outputs.latest_version }}';
            const currentVersion = '${{ steps.version-check.outputs.current_version }}';
            
            const message = `## ⚠️ Terraform Version Update Available
            
            This PR contains Terraform code. Current version **${currentVersion}** can be updated to **${latestVersion}**.
            
            **${updateCount}** file(s) need to be updated.
            
            While this doesn't block merging, consider updating to benefit from the latest features and fixes.
            
            Check the action logs for detailed information.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
